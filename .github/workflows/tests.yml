name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The real-eBook tests are skipped if this download fails.
      - name: Download the eBook
        run: python scripts/download_document.py
        continue-on-error: true
      # Runs without API keys: Pinecone and the LLM are faked; live tests are skipped.
      - name: Pytest
        run: pytest
